name: Runner probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-13
          - os: macos-14
          - os: macos-15
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - name: Who am I
        run: |
          echo "runner=${{ matrix.os }}"
          uname -a
          sw_vers 2>/dev/null || true
          xcodebuild -version 2>/dev/null || echo "no xcode"
