name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          xcodebuild \
            -project DongPianDi.xcodeproj \
            -scheme DongPianDi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -quiet \
            archive

      - name: Package IPA
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/App.xcarchive/Products/Applications/DongPianDi.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "expected .app not found, dumping archive tree:"
            find "$RUNNER_TEMP/App.xcarchive" -maxdepth 5 -name "*.app" -print
            find "$RUNNER_TEMP/App.xcarchive" -maxdepth 3 -type d -print | head -40
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry DongPianDi.ipa Payload
          ls -lh DongPianDi.ipa
          shasum -a 256 DongPianDi.ipa
          echo "--- payload ---"
          ls Payload/DongPianDi.app | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DongPianDi-ipa
          path: ${{ runner.temp }}/DongPianDi.ipa
          if-no-files-found: error
